name: CI

"on":
  merge_group: {}
  pull_request: {}
  push:
    branches-ignore:
      # These should always correspond to pull requests, so ignore them for
      # the push trigger and let them be triggered by the pull_request
      # trigger, avoiding running the workflow twice.
      - "dependabot/**"
      - "renovate/**"
      - "tickets/**"
      - "u/**"
    tags:
      - "*"

env:
  UV_VERSION: "0.13.7"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run pre-commit
        run: uvx --with pre-commit-uv pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Python 3.15 is a pre-release; some dependencies (e.g. pyyaml, via
    # uvicorn[standard]) have no wheels for it yet and fail to build, so
    # its failures are reported but do not fail the workflow.
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.14"
        experimental:
          - false
        include:
          - python: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}

      - name: Run nox
        run: uv run --only-group=nox nox -s typing test

  test-py313:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Test models and client on Python 3.13
        run: uv run --only-group=nox nox -s test-py313

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build image
        run: docker build -t lcftp:ci .

      - name: Check entry points
        run: docker run --rm lcftp:ci --help | grep -E "web|worker|migrate"

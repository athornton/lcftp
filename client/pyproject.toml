[project]
name = "lcftp-client"
description = "Observatory-side client for LCFTP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: English",
    "Operating System :: POSIX",
    "Typing :: Typed",
]
dependencies = [
    "astropy>=7.0",
    "click>=8.2",
    "httpx>=0.28",
    "lcftp-models",
    "numpy>=2.0",
    "tomli-w>=1.0",
]
dynamic = ["version"]

[project.scripts]
lcftp-client = "lcftp_client.cli:main"

[project.entry-points."lcftp.drivers"]
simulated = "lcftp_client.drivers.simulated:create_driver"

[[project.authors]]
name = "Adam Thornton"
email = "athornton@gmail.com"

[project.urls]
Source = "https://github.com/athornton/lcftp"

[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
root = ".."

[tool.ruff]
extend = "../pyproject.toml"
target-version = "py313"
